# DKMS rebuilds the module for every kernel that gets installed, so a kernel
# upgrade does not silently leave the mixer without a soundcard. Install with:
#
#   sudo cp -r kernel /usr/src/djmt1_audio-0.1
#   sudo dkms install djmt1_audio/0.1
#
# Once installed, udev loads it whenever the mixer is plugged in (the module's
# USB alias matches interface 0 only), so it needs no modules-load.d entry.
#
# Clang-built kernels need LLVM=1; add it to MAKE[0] on those.
PACKAGE_NAME="djmt1_audio"
PACKAGE_VERSION="0.1"
BUILT_MODULE_NAME[0]="djmt1_audio"
DEST_MODULE_LOCATION[0]="/updates/dkms"
MAKE[0]="make KDIR=${kernel_source_dir}"
CLEAN="make KDIR=${kernel_source_dir} clean"
AUTOINSTALL="yes"
